<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media Sentiment Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../static/css/index.css" />
  </head>
  <body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen">
    <div class="min-h-screen flex flex-col items-center justify-center p-6">
      <div
        class="w-full max-w-4xl bg-white bg-opacity-90 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden"
      >
        <header
            class="bg-gradient-to-r from-red-600 to-blue-600 p-8 text-center"
          >
            <h1 class="text-4xl md:text-5xl font-extrabold text-white">
              <i class="fab fa-youtube mr-2"></i>
              <i class="fab fa-google mr-2"></i>
              Social Sentiment
            </h1>
            <p class="text-xl text-gray-200 mt-2">
              Analyze sentiment from YouTube, Google Maps, Text, or File
            </p>
          </header>

        <form id="inputForm" class="p-8" method="POST" enctype="multipart/form-data">
          <div class="flex flex-wrap gap-4 mb-6">
            <button
              type="button"
              onclick="setActiveSection('youtube')"
              id="youtubeSectionBtn"
              class="flex-1 py-3 px-6 rounded-lg font-semibold transition duration-300 bg-gray-200 text-gray-700 hover:bg-gray-300"
            >
              <i class="fab fa-youtube mr-2"></i>YouTube
            </button>
            <button
              type="button"
              onclick="setActiveSection('googlemaps')"
              id="googlemapsSectionBtn"
              class="flex-1 py-3 px-6 rounded-lg font-semibold transition duration-300 bg-gray-200 text-gray-700 hover:bg-gray-300"
            >
              <i class="fab fa-google mr-2"></i>Google Maps
            </button>
            <button
              type="button"
              onclick="setActiveSection('text')"
              id="textSectionBtn"
              class="flex-1 py-3 px-6 rounded-lg font-semibold transition duration-300 bg-gray-200 text-gray-700 hover:bg-gray-300"
            >
              <i class="fas fa-comment mr-2"></i>Text
            </button>
            <button
              type="button"
              onclick="setActiveSection('file')"
              id="fileSectionBtn"
              class="flex-1 py-3 px-6 rounded-lg font-semibold transition duration-300 bg-gray-200 text-gray-700 hover:bg-gray-300"
            >
              <i class="fas fa-upload mr-2"></i>File Upload
            </button>
          </div>

          <!-- YouTube Section -->
          <div id="youtubeSection" class="mb-6 hidden">
            <label
              for="youtubeLink"
              class="block text-gray-700 font-semibold mb-2"
            >
              <i class="fab fa-youtube text-red-600 mr-2"></i>YouTube Video
              Link:
            </label>
            <input
              type="url"
              id="youtubeLink"
              name="youtube_url"
              placeholder="Enter YouTube link"
              class="w-full p-4 border-2 border-red-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400 text-gray-800 placeholder-gray-500"
            />
            <input type="hidden" id="youtubeVideoId" name="videoId" />

            <div id="youtubeEmbed" class="mt-4 hidden">
              <div class="bg-gray-100 p-6 rounded-lg shadow-xl">
                <iframe
                  width="100%"
                  height="315"
                  id="youtubeIframe"
                  frameborder="0"
                  allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen
                ></iframe>
              </div>
            </div>
          </div>

          <!-- Google Maps Section -->
          <div id="googlemapsSection" class="hidden mb-6">
            <label
              for="googlemapsLink"
              class="block text-gray-700 font-semibold mb-2"
            >
              <i class="fab fa-google text-blue-600 mr-2"></i>Google Maps Embed URL:
            </label>
            <input
              type="url"
              name="googlemaps_url"
              id="googlemapsLink"
              placeholder="Enter Google Maps embed URL"
              class="w-full p-4 border-2 border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-800 placeholder-gray-500"
            />
            <div id="googlemapsEmbed" class="mt-4 hidden">
              <div class="bg-gray-100 p-6 rounded-lg shadow-xl">
                <iframe
                  width="100%"
                  height="450"
                  id="googlemapsIframe"
                  frameborder="0"
                  style="border:0"
                  allowfullscreen
                ></iframe>
              </div>
            </div>
          </div>

          <!-- Text Section -->
          <div id="textSection" class="hidden mb-6">
            <label for="textInput" class="block text-gray-700 font-semibold mb-2">
              <i class="fas fa-comment text-blue-600 mr-2"></i>Normal Text for
              Sentiment Analysis:
            </label>
            <textarea
              id="textInput"
              name="comment"
              rows="5"
              class="w-full p-4 border-2 border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none text-gray-800 placeholder-gray-500"
              placeholder="Enter normal text here..."
            ></textarea>
          </div>

          <!-- File Upload Section -->
          <div id="fileSection" class="hidden mb-6">
            <label
              for="fileInput"
              class="block text-gray-700 font-semibold mb-2"
            >
              <i class="fas fa-upload text-purple-600 mr-2"></i>Upload File for
              Sentiment Analysis:
            </label>
            <input
              type="file"
              id="fileInput"
              name="file"
              accept=".txt,.csv"
              class="w-full p-4 border-2 border-purple-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 text-gray-800 placeholder-gray-500"
            />
            <p class="mt-2 text-gray-500 text-sm">Supported formats: .txt, .csv | Max size: 5MB</p>
          </div>

          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 px-6 rounded-lg hover:from-blue-700 hover:to-purple-700 transition duration-300 mt-6"
          >
            <i class="fas fa-chart-bar mr-2"></i>Analyze Sentiment
          </button>
        </form>
      </div>
    </div>

    <script src="../static/js/index.js"></script>
  </body>
</html>
